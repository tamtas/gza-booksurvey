<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book journey</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Noto+Sans+Georgian:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#afd6e7; font-family:'Noto Sans Georgian','Archivo',system-ui,sans-serif; color:#172a55; -webkit-font-smoothing:antialiased; }
  #wrap { position:relative; height:100%; overflow:hidden; }
  svg#map { display:block; width:100%; height:100%; }
  * { scrollbar-width:thin; scrollbar-color:rgba(23,42,85,0.28) transparent; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:rgba(23,42,85,0.24); border-radius:999px; border:3px solid transparent; background-clip:content-box; }
  ::-webkit-scrollbar-track { background:transparent; }
  .card {
    position:absolute; left:1.1rem; bottom:1.1rem; width:min(330px, calc(100% - 2.2rem));
    background:#fff; border:1px solid rgba(23,42,85,0.12); border-radius:16px;
    box-shadow:0 14px 34px rgba(23,42,85,0.18); padding:0.95rem 1.1rem 1.05rem;
  }
  .eyebrow { display:flex; align-items:center; gap:0.45rem; font-size:0.66rem; font-weight:800; letter-spacing:0.12em; text-transform:uppercase; color:#ec3b2e; margin-bottom:0.35rem; }
  .live { display:none; align-items:center; gap:0.32rem; }
  .live.on { display:inline-flex; }
  .live i { width:7px; height:7px; border-radius:50%; background:#ec3b2e; animation:beat 1.6s ease-in-out infinite; }
  @keyframes beat { 0%,100% { box-shadow:0 0 0 0 rgba(236,59,46,0.5) } 50% { box-shadow:0 0 0 6px rgba(236,59,46,0) } }
  .city { font-size:1.3rem; font-weight:800; letter-spacing:-0.02em; line-height:1.15; margin-bottom:0.3rem; }
  .note { font-size:0.85rem; line-height:1.5; color:rgba(23,42,85,0.68); text-wrap:pretty; }
  .prog { margin-top:0.75rem; }
  .bar { height:6px; border-radius:999px; background:rgba(23,42,85,0.12); overflow:hidden; }
  .bar span { display:block; height:100%; width:0%; border-radius:999px; background:#ec3b2e; transition:width 0.5s ease; }
  .meta { display:flex; justify-content:space-between; gap:0.6rem; margin-top:0.4rem; font-size:0.76rem; font-weight:700; letter-spacing:0.02em; color:rgba(23,42,85,0.72); }
  .controls { position:absolute; top:1.1rem; left:1.1rem; display:flex; gap:0.5rem; }
  .btn {
    font:inherit; font-size:0.82rem; font-weight:700; color:#172a55; background:#fff;
    border:1px solid rgba(23,42,85,0.16); border-radius:12px; padding:0.55rem 0.85rem; min-height:44px;
    cursor:pointer; box-shadow:0 1px 2px rgba(23,42,85,0.06); transition:border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { border-color:rgba(23,42,85,0.4); box-shadow:0 4px 14px rgba(23,42,85,0.12); }
  .rail { position:absolute; right:1.1rem; top:1.1rem; bottom:1.1rem; width:212px; display:flex; flex-direction:column; gap:0.3rem; overflow-y:auto; overflow-x:hidden; padding-right:0.2rem; }
  .stopbtn {
    box-sizing:border-box;
    display:flex; align-items:center; gap:0.6rem; width:100%; font:inherit; font-size:0.82rem; font-weight:600;
    text-align:left; color:#172a55; background:rgba(255,255,255,0.72); border:1px solid transparent;
    border-radius:11px; padding:0.5rem 0.65rem; min-height:42px; cursor:pointer; transition:background 0.15s ease;
  }
  .stopbtn:hover { background:#fff; }
  .stopbtn.sel { background:#fff; border-color:rgba(236,59,46,0.4); box-shadow:0 3px 12px rgba(23,42,85,0.1); }
  .stopbtn .idx { flex:0 0 auto; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.64rem; font-weight:800; background:rgba(23,42,85,0.1); }
  .stopbtn.done .idx { background:#ec3b2e; color:#fff; }
  .stopbtn.transit .idx { background:#fff; color:#ec3b2e; box-shadow:inset 0 0 0 2px #ec3b2e; animation:beat 1.6s ease-in-out infinite; }
  .stopbtn.upcoming { color:rgba(23,42,85,0.55); }
  .stopbtn .st { margin-left:auto; font-size:0.7rem; font-weight:800; letter-spacing:0.04em; text-transform:uppercase; color:rgba(23,42,85,0.72); }
  .stopbtn.done .st { color:#ec3b2e; }
  .stopbtn.transit .st { color:#ec3b2e; }
  @media (max-width: 820px) {
    .rail { display:none; }
    .card { left:0.8rem; right:0.8rem; bottom:0.8rem; width:auto; }
    .controls { top:0.8rem; left:0.8rem; }
  }
</style>
</head>
<body>
<div id="wrap">
  <svg id="map"></svg>
  <div class="controls">
    <button class="btn" id="play"></button>
    <button class="btn" id="restart"></button>
  </div>
  <div class="rail" id="rail"></div>
  <div class="card">
    <div class="eyebrow"><span id="eyebrow"></span><span class="live" id="livedot"><i></i><span id="livetxt"></span></span></div>
    <div class="city" id="city"></div>
    <div class="note" id="note"></div>
    <div class="prog">
      <div class="bar"><span id="barfill"></span></div>
      <div class="meta"><span id="pct"></span><span id="updated"></span></div>
    </div>
  </div>
</div>
<script>
const LANG = (new URLSearchParams(location.search).get('lang') || 'ge');
const L = (o) => (o && (o[LANG] || o.en)) || '';

// Live status comes from the "Journey" tab of the festival sheet.
// Columns: City EN | City GE | City DE | Lat | Lon | Date | Status | Note EN | Note GE | Note DE | Updated
const SHEET_ID = '13nvVci3LtQlGrKsFiTygtyUQJQM2nOkFm2ZrK3kgRGI';
const JOURNEY_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&sheet=Journey';
const POLL_MS = 120000;

// Fallback route, used until the Journey tab has rows.
const FALLBACK = [
  { lat:41.7151, lon:44.8271, status:'done', name:{ge:'თბილისი',en:'Tbilisi',de:'Tiflis'}, when:{ge:'1 სექტემბერი',en:'1 September',de:'1. September'},
    note:{ge:'გამომცემლობები წიგნებს ალაგებენ და ყუთებს ნიშნავენ.',en:'Publishers pack the crates and label every box.',de:'Die Verlage packen die Kisten und beschriften jede Box.'} },
  { lat:42.1462, lon:41.6730, dy:-12, status:'done', name:{ge:'ფოთი',en:'Poti',de:'Poti'}, when:{ge:'4 სექტემბერი',en:'4 September',de:'4. September'},
    note:{ge:'ყუთები შავი ზღვის პორტში ჩადის და გემზე იტვირთება.',en:'The crates reach the Black Sea port and go aboard.',de:'Die Kisten erreichen den Schwarzmeerhafen und gehen an Bord.'} },
  { lat:41.0082, lon:28.9784, status:'transit', name:{ge:'სტამბოლი',en:'Istanbul',de:'Istanbul'}, when:{ge:'8 სექტემბერი',en:'8 September',de:'8. September'},
    note:{ge:'გადატვირთვა — ტვირთი ევროპულ მარშრუტს უერთდება.',en:'Transfer point — the freight joins the European route.',de:'Umschlagpunkt — die Fracht wechselt auf die Europaroute.'} },
  { lat:44.4268, lon:26.1025, status:'upcoming', name:{ge:'ბუქარესტი',en:'Bucharest',de:'Bukarest'}, when:{ge:'12 სექტემბერი',en:'12 September',de:'12. September'},
    note:{ge:'პირველი გაჩერება ევროკავშირში, საბაჟო დოკუმენტები.',en:'First stop inside the EU, customs paperwork cleared.',de:'Erster Halt in der EU, Zollpapiere erledigt.'} },
  { lat:47.4979, lon:19.0402, status:'upcoming', name:{ge:'ბუდაპეშტი',en:'Budapest',de:'Budapest'}, when:{ge:'15 სექტემბერი',en:'15 September',de:'15. September'},
    note:{ge:'ნაწილი ადგილობრივ ქართულ წიგნის საღამოზე ჩერდება.',en:'A few titles stay for a Georgian reading evening.',de:'Einige Titel bleiben für einen georgischen Leseabend.'} },
  { lat:48.2082, lon:16.3738, status:'upcoming', name:{ge:'ვენა',en:'Vienna',de:'Wien'}, when:{ge:'18 სექტემბერი',en:'18 September',de:'18. September'},
    note:{ge:'მთარგმნელებთან შეხვედრა, სანამ ტვირთი ჩრდილოეთით მიდის.',en:'A meeting with translators before the load heads north.',de:'Treffen mit Übersetzern, bevor die Ladung nordwärts fährt.'} },
  { lat:50.0755, lon:14.4378, status:'upcoming', name:{ge:'პრაღა',en:'Prague',de:'Prag'}, when:{ge:'22 სექტემბერი',en:'22 September',de:'22. September'},
    note:{ge:'ბოლო შემოწმება — ყუთები ითვლება და ილუქება.',en:'Final check — crates counted and sealed.',de:'Letzte Kontrolle — Kisten gezählt und versiegelt.'} },
  { lat:52.5200, lon:13.4050, status:'upcoming', name:{ge:'ბერლინი',en:'Berlin',de:'Berlin'}, when:{ge:'11 ოქტომბერი',en:'11 October',de:'11. Oktober'},
    note:{ge:'წიგნები ქართული წიგნის დღეზე თაროებზე ლაგდება.',en:'The books reach the shelves of Georgian Book Day.',de:'Die Bücher erreichen die Regale des Georgischen Buchtags.'} }
];

const UI = {
  play:{ge:'დაკვრა',en:'Play',de:'Abspielen'},
  pause:{ge:'პაუზა',en:'Pause',de:'Pause'},
  restart:{ge:'თავიდან',en:'Restart',de:'Neu starten'},
  stop:{ge:'გაჩერება',en:'Stop',de:'Station'},
  live:{ge:'ცოცხალი',en:'Live',de:'Live'},
  planned:{ge:'გეგმა',en:'Planned route',de:'Geplante Route'},
  done:{ge:'გავლილი',en:'Done',de:'Erledigt'},
  transit:{ge:'გზაში',en:'In transit',de:'Unterwegs'},
  upcoming:{ge:'მოსალოდნელი',en:'Upcoming',de:'Bevorstehend'},
  complete:{ge:'მარშრუტი გავლილია',en:'of route complete',de:'der Route zurückgelegt'},
  updated:{ge:'განახლდა',en:'Updated',de:'Aktualisiert'},
  never:{ge:'—',en:'—',de:'—'}
};

let STOPS = FALLBACK.slice();
let isLive = false, lastUpdated = null;

const svg = d3.select('#map');
const gLand = svg.append('g'), gGhost = svg.append('g'), gDraw = svg.append('g'), gStops = svg.append('g'), gMover = svg.append('g');
let world = null, size = {w:0,h:0}, projection = null, pathGen = null;
let legPaths = [], stopPts = [], selected = 0, playing = false, timer = null;

const routeLine = () => ({ type:'LineString', coordinates: STOPS.map(s => [s.lon, s.lat]) });
const densify = (a, b, n) => {
  const it = d3.geoInterpolate([a.lon, a.lat], [b.lon, b.lat]);
  return d3.range(n + 1).map(i => it(i / n));
};

// Progress derived from per-stop status.
function progress() {
  let lastDone = 0, transit = -1;
  STOPS.forEach((s, i) => {
    if (s.status === 'done') lastDone = i;
    if (s.status === 'transit' && transit < 0) transit = i;
  });
  const legs = Math.max(STOPS.length - 1, 1);
  const partial = transit > 0 ? 0.5 : 0;
  const doneLegs = transit > 0 ? transit - 1 : lastDone;
  return { lastDone, transit, doneLegs, partial, pct: Math.round(((doneLegs + partial) / legs) * 100) };
}

function currentIndex() { const p = progress(); return p.transit >= 0 ? p.transit : p.lastDone; }

function layout() {
  const el = document.getElementById('wrap');
  size = { w: el.clientWidth, h: el.clientHeight };
  const padR = size.w > 820 ? 330 : 90;
  projection = d3.geoMercator().fitExtent([[90, 115], [size.w - padR, size.h - 205]], routeLine());
  pathGen = d3.geoPath(projection);
  draw();
}

function draw() {
  if (!world) return;
  svg.attr('viewBox', '0 0 ' + size.w + ' ' + size.h);

  gLand.selectAll('path').data(world.features).join('path')
    .attr('d', pathGen)
    .attr('fill', d => (d.id === '268' || d.id === '276') ? '#e2eff6' : '#f4f9fb')
    .attr('stroke', 'rgba(23,42,85,0.22)').attr('stroke-width', 0.7);

  stopPts = STOPS.map(s => projection([s.lon, s.lat]));
  const legGeom = STOPS.slice(1).map((_, i) => ({ type:'LineString', coordinates: densify(STOPS[i], STOPS[i+1], 48) }));

  gGhost.selectAll('path').data(legGeom).join('path')
    .attr('d', pathGen).attr('fill','none')
    .attr('stroke','rgba(23,42,85,0.22)').attr('stroke-width',1.8)
    .attr('stroke-dasharray','2 7').attr('stroke-linecap','round');

  gDraw.selectAll('path').data(legGeom).join('path')
    .attr('class','leg').attr('d', pathGen).attr('fill','none')
    .attr('stroke','#ec3b2e').attr('stroke-width',2.6).attr('stroke-linecap','round')
    .attr('stroke-dasharray', function(){ const l=this.getTotalLength(); return l+' '+l; })
    .attr('stroke-dashoffset', function(){ return this.getTotalLength(); });
  legPaths = gDraw.selectAll('path.leg').nodes();

  const dots = gStops.selectAll('g.stop').data(STOPS).join(
    enter => {
      const g = enter.append('g').attr('class','stop').style('cursor','pointer');
      g.append('circle').attr('class','halo').attr('r',13).attr('fill','rgba(236,59,46,0.16)').attr('opacity',0);
      g.append('circle').attr('class','dot').attr('r',5).attr('stroke','#fff').attr('stroke-width',2);
      g.append('text').attr('class','lbl').attr('font-size',12).attr('font-weight',700)
        .attr('paint-order','stroke').attr('stroke','#fff').attr('stroke-width',3.5).attr('stroke-linejoin','round');
      return g;
    }
  );
  dots.attr('transform', (d,i) => 'translate(' + stopPts[i][0] + ',' + stopPts[i][1] + ')')
    .on('click', (e,d) => select(STOPS.indexOf(d)));
  dots.select('text.lbl').text(d => L(d.name)).attr('fill','#172a55')
    .attr('y', d => 4 + (d.dy || 0))
    .attr('text-anchor', (d,i) => stopPts[i][0] > size.w * 0.55 ? 'end' : 'start')
    .attr('x', (d,i) => stopPts[i][0] > size.w * 0.55 ? -10 : 10);

  gMover.selectAll('*').remove();
  gMover.append('circle').attr('class','mover').attr('r',7).attr('fill','#ec3b2e')
    .attr('stroke','#fff').attr('stroke-width',2.5).attr('opacity',0);

  buildRail();
  applyProgress(true);
}

// Snap route + mover to the live position without animating.
function applyProgress(instant) {
  const p = progress();
  legPaths.forEach((path, i) => {
    const len = path.getTotalLength();
    let frac = 0;
    if (i < p.doneLegs) frac = 1;
    else if (i === p.doneLegs) frac = p.partial ? p.partial : (p.transit < 0 && i < p.lastDone ? 1 : 0);
    d3.select(path).interrupt().attr('stroke-dashoffset', len * (1 - frac));
  });
  const pos = moverPos();
  gMover.select('circle.mover').interrupt().attr('cx', pos[0]).attr('cy', pos[1]).attr('opacity', 1);
  renderState();
}

function moverPos() {
  const p = progress();
  if (p.partial && legPaths[p.doneLegs]) {
    const path = legPaths[p.doneLegs];
    const pt = path.getPointAtLength(path.getTotalLength() * p.partial);
    return [pt.x, pt.y];
  }
  return stopPts[p.lastDone] || stopPts[0];
}

function statusOf(i) { return STOPS[i].status || 'upcoming'; }

function renderState() {
  const p = progress();
  gStops.selectAll('g.stop').select('circle.dot')
    .attr('fill', (d,i) => statusOf(i) === 'upcoming' ? 'rgba(23,42,85,0.28)' : '#ec3b2e')
    .attr('r', (d,i) => i === selected ? 7 : 5);
  gStops.selectAll('g.stop').select('circle.halo')
    .attr('opacity', (d,i) => i === selected ? 1 : 0);
  gStops.selectAll('g.stop').select('text.lbl')
    .attr('opacity', (d,i) => i === selected ? 1 : 0.72)
    .attr('font-weight', (d,i) => i === selected ? 800 : 600);

  const s = STOPS[selected];
  document.getElementById('eyebrow').textContent =
    L(UI.stop) + ' ' + (selected + 1) + ' / ' + STOPS.length + (L(s.when) ? ' · ' + L(s.when) : '');
  document.getElementById('city').textContent = L(s.name);
  document.getElementById('note').textContent = L(s.note);
  document.getElementById('barfill').style.width = p.pct + '%';
  document.getElementById('pct').textContent = p.pct + '% ' + L(UI.complete);
  document.getElementById('updated').textContent = isLive
    ? L(UI.updated) + ' ' + relTime(lastUpdated)
    : L(UI.planned);
  const live = document.getElementById('livedot');
  live.classList.toggle('on', isLive);
  document.getElementById('livetxt').textContent = L(UI.live);

  d3.selectAll('#rail .stopbtn')
    .attr('class', (d,i) => 'stopbtn ' + statusOf(i) + (i === selected ? ' sel' : ''));
}

function relTime(d) {
  if (!d) return L(UI.never);
  const mins = Math.round((Date.now() - d.getTime()) / 60000);
  if (mins < 1) return { ge:'ახლახან', en:'just now', de:'gerade eben' }[LANG] || 'just now';
  if (mins < 60) return mins + ' min';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + ' h';
  return d.toLocaleDateString();
}

function buildRail() {
  const rail = d3.select('#rail');
  rail.selectAll('button').data(STOPS).join('button')
    .attr('class','stopbtn')
    .on('click', (e,d) => select(STOPS.indexOf(d)))
    .html((d,i) => '<span class="idx">' + (i+1) + '</span><span>' + L(d.name) + '</span><span class="st">' + L(UI[d.status || 'upcoming']) + '</span>');
}

function select(i) {
  stopPlayback();
  selected = i;
  renderState();
}

// Replay the completed part of the journey as an animation.
function playFrom(i) {
  const p = progress();
  const target = p.transit >= 0 ? p.doneLegs : p.lastDone;
  if (i > target) { playing = false; syncBtn(); return; }
  if (i === target && !p.partial) { playing = false; selected = currentIndex(); renderState(); syncBtn(); return; }

  const path = legPaths[i];
  if (!path) { playing = false; syncBtn(); return; }
  const len = path.getTotalLength();
  const frac = i < target ? 1 : p.partial;
  const mover = gMover.select('circle.mover');

  d3.select(path).transition().duration(1800 * frac + 200).ease(d3.easeCubicInOut)
    .attr('stroke-dashoffset', len * (1 - frac));
  mover.transition().duration(1800 * frac + 200).ease(d3.easeCubicInOut)
    .tween('pos', () => (t) => {
      const pt = path.getPointAtLength(t * frac * len);
      mover.attr('cx', pt.x).attr('cy', pt.y);
    })
    .on('end', () => {
      selected = Math.min(i + 1, STOPS.length - 1);
      renderState();
      if (playing) timer = setTimeout(() => playFrom(i + 1), 1200);
    });
}

function stopPlayback() {
  playing = false; clearTimeout(timer);
  gMover.select('circle.mover').interrupt();
  legPaths.forEach(p => d3.select(p).interrupt());
  syncBtn();
}

function restart() {
  clearTimeout(timer);
  gMover.select('circle.mover').interrupt();
  legPaths.forEach(p => { d3.select(p).interrupt().attr('stroke-dashoffset', p.getTotalLength()); });
  selected = 0;
  const pos = stopPts[0];
  gMover.select('circle.mover').attr('cx', pos[0]).attr('cy', pos[1]).attr('opacity', 1);
  renderState();
  playing = true; syncBtn();
  timer = setTimeout(() => playFrom(0), 500);
}

function syncBtn() { document.getElementById('play').textContent = playing ? L(UI.pause) : L(UI.play); }

document.getElementById('play').onclick = () => {
  if (playing) { stopPlayback(); applyProgress(true); }
  else restart();
};
document.getElementById('restart').onclick = restart;
document.getElementById('restart').textContent = L(UI.restart);

/* ---------- Sheet loading ---------- */
function parseCSV(text) {
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], n = text[i+1];
    if (q) { if (c === '"' && n === '"') { field += '"'; i++; } else if (c === '"') q = false; else field += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (c !== '\r') field += c;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

const normStatus = (v) => {
  const s = (v || '').trim().toLowerCase();
  if (s.startsWith('done') || s.startsWith('arriv') || s === 'ok' || s === 'yes') return 'done';
  if (s.startsWith('transit') || s.startsWith('in ') || s.startsWith('under') || s.startsWith('moving')) return 'transit';
  return 'upcoming';
};

function findCol(header, ...needles) {
  for (const n of needles) { const i = header.findIndex(h => h.includes(n)); if (i >= 0) return i; }
  return -1;
}

function rowsToStops(rows) {
  const header = rows[0].map(h => h.trim().toLowerCase());
  const c = {
    en: findCol(header, 'city en', 'city', 'stop'),
    ge: findCol(header, 'city ge', 'city ka'),
    de: findCol(header, 'city de'),
    lat: findCol(header, 'lat'),
    lon: findCol(header, 'lon', 'lng'),
    date: findCol(header, 'date', 'when'),
    status: findCol(header, 'status'),
    nEn: findCol(header, 'note en'),
    nGe: findCol(header, 'note ge', 'note ka'),
    nDe: findCol(header, 'note de'),
    upd: findCol(header, 'updated')
  };
  const out = []; let newest = null;
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    const lat = parseFloat((row[c.lat] || '').trim()), lon = parseFloat((row[c.lon] || '').trim());
    const nameEn = (row[c.en] || '').trim();
    if (!nameEn || !isFinite(lat) || !isFinite(lon)) continue;
    const date = c.date >= 0 ? (row[c.date] || '').trim() : '';
    out.push({
      lat, lon,
      status: normStatus(row[c.status]),
      name: { en: nameEn, ge: (row[c.ge] || '').trim() || nameEn, de: (row[c.de] || '').trim() || nameEn },
      when: { en: date, ge: date, de: date },
      note: {
        en: (row[c.nEn] || '').trim(),
        ge: (row[c.nGe] || '').trim() || (row[c.nEn] || '').trim(),
        de: (row[c.nDe] || '').trim() || (row[c.nEn] || '').trim()
      }
    });
    if (c.upd >= 0) { const d = new Date((row[c.upd] || '').trim()); if (!isNaN(d)) if (!newest || d > newest) newest = d; }
  }
  return { stops: out, updated: newest };
}

async function loadJourney() {
  const res = await fetch(JOURNEY_URL + '&_=' + Date.now());
  if (!res.ok) throw new Error('sheet ' + res.status);
  const rows = parseCSV(await res.text()).filter(r => r.length > 1 && r.some(x => x.trim()));
  if (rows.length < 2) throw new Error('empty');
  const { stops, updated } = rowsToStops(rows);
  if (stops.length < 2) throw new Error('too few stops');
  return { stops, updated: updated || new Date() };
}

function refresh(first) {
  loadJourney().then(({ stops, updated }) => {
    const changed = JSON.stringify(stops.map(s => [s.name.en, s.status])) !== JSON.stringify(STOPS.map(s => [s.name.en, s.status]));
    STOPS = stops; isLive = true; lastUpdated = updated;
    if (first || changed) {
      selected = Math.min(selected, STOPS.length - 1);
      layout();
      if (first) { selected = currentIndex(); restart(); }
      else applyProgress(true);
    } else renderState();
  }).catch(() => {
    isLive = false;
    if (first) { layout(); selected = currentIndex(); restart(); }
    else renderState();
  });
}

d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(topo => {
  world = topojson.feature(topo, topo.objects.countries);
  layout();
  syncBtn();
  refresh(true);
  setInterval(() => refresh(false), POLL_MS);
});

let rt = null;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { stopPlayback(); layout(); applyProgress(true); }, 180); });
